[package]
name = "brains-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["fts"]
fts = ["brains-local/fts"]
# Embedded document conversion (issue #19): capabilities report it; the
# conversion itself runs in the CLI, which passes its own converter.
convert = ["brains-adapter-convert/xberg"]
# URL import ladder (issue #22): Readability + HTML-to-Markdown, offline of
# any third-party reader API. The Worker mounts its own equivalents.
url-import = ["dep:dom_smoothie", "dep:htmd", "dep:url"]

[dependencies]
brains-adapter-convert = { workspace = true, optional = true }
brains-build-info.workspace = true
brains-api-types.workspace = true
brains-format.workspace = true
brains-sdk = { path = "../../sdk/rust" }
brains-domain.workspace = true
brains-application.workspace = true
brains-ports.workspace = true
brains-local.workspace = true
futures.workspace = true
diffy.workspace = true
dom_smoothie = { version = "0.19", optional = true }
htmd = { version = "0.5", optional = true }
url = { version = "2", optional = true }
hex.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
unicase.workspace = true
