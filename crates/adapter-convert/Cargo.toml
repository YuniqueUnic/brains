[package]
name = "brains-adapter-convert"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The embedded Xberg converter (MIT). 1.0.0-rc.5 shipped broken office/
# excel/html feature gates (they referenced `zip` unconditionally); the
# 1.3.x line is based on zip 9 and compiles with the full set re-enabled.
xberg = ["dep:xberg"]

[dependencies]
brains-domain.workspace = true
brains-ports.workspace = true
xberg = { version = "=1.3.10", default-features = false, features = ["pdf", "office", "excel", "html", "tokio-runtime"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
