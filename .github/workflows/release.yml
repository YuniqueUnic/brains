name: Release

# The default branch owns the build recipe; the release tag owns the source.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag (e.g. v0.2.0) to build assets for"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  WASM_RUSTFLAGS: --cfg getrandom_backend="wasm_js"

jobs:
  prepare:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.version }}
      - name: Check unified product versions
        run: python3 scripts/check-versions.py
      - name: Resolve tag, package version and commit
        id: identity
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tomllib

          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          tag = os.environ["INPUT_VERSION"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag must match Cargo workspace version: v{version}")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD^{commit}"], text=True).strip()
          subprocess.run(["gh", "release", "view", tag], check=True, stdout=subprocess.DEVNULL)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\nversion={version}\nsha={sha}\n")
          print(f"Release {tag} from {sha}")
          PY

  cli-server:
    name: bsx + brains-server (${{ matrix.id }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - id: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - id: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install the repository Rust toolchain
        run: rustup show
      - name: Install release target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (release)
        run: cargo build --locked --release -p brains-server -p brains-cli --target ${{ matrix.target }}
      - name: Verify compiled identity
        run: |
          actual="$(target/${{ matrix.target }}/release/bsx --version)"
          expected="bsx ${VERSION} (git ${RELEASE_SHA:0:12})"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Expected: %s\nActual: %s\n' "$expected" "$actual" >&2
            exit 1
          fi
      - name: Package
        run: |
          DIR="brains-${VERSION}-${{ matrix.id }}"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/brains-server" \
             "target/${{ matrix.target }}/release/bsx" "$DIR/"
          cp docs/native-release.md "$DIR/README.md"
          "$DIR/bsx" --version > "$DIR/VERSION"
          tar czf "$DIR.tar.gz" "$DIR"
          shasum -a 256 "$DIR.tar.gz" > "$DIR.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: brains-${{ matrix.id }}
          path: |
            brains-*.tar.gz
            brains-*.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  web-worker:
    name: web dist + worker bundle
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install the repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --dir apps/web build
      - name: Install Worker build tool for the host
        run: cargo install worker-build --locked --version 0.8.7
      - name: Build worker wasm
        working-directory: apps/worker
        run: worker-build --release
        env:
          RUSTFLAGS: ${{ env.WASM_RUSTFLAGS }}
      # CI's codegen drift check owns generation. Publish this commit's contract.
      - uses: actions/upload-artifact@v7
        with:
          name: brains-openapi
          path: sdk/openapi/brains-openapi.json
          retention-days: 7
          if-no-files-found: error
      - name: Package web dist
        run: |
          tar czf "brains-web-${VERSION}.tar.gz" -C apps/web dist
          shasum -a 256 "brains-web-${VERSION}.tar.gz" > "brains-web-${VERSION}.tar.gz.sha256"
      - name: Package worker bundle
        run: |
          DIR="brains-worker-${VERSION}"
          python3 scripts/package-worker.py "$DIR" --version "$VERSION" --sha "$RELEASE_SHA"
          tar czf "$DIR.tar.gz" "$DIR"
          shasum -a 256 "$DIR.tar.gz" > "$DIR.tar.gz.sha256"
          (
            cd "$DIR"
            node "$GITHUB_WORKSPACE/apps/worker/node_modules/wrangler/bin/wrangler.js" \
              deploy --config wrangler.json --dry-run --outdir "$RUNNER_TEMP/brains-worker-dry-run"
          )
        env:
          WRANGLER_SEND_METRICS: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: brains-web-worker
          path: |
            brains-web-*.tar.gz*
            brains-worker-*.tar.gz*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [prepare, cli-server, web-worker]
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Verify remote release tag
        run: |
          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [[ -z "$remote_tag" ]]; then
            echo "Release tag must already exist" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
          actual="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "$actual" != "$RELEASE_SHA" ]]; then
            echo "Remote tag points to a different commit; refusing to publish" >&2
            exit 1
          fi
      - name: Publish
        run: |
          gh release upload "$RELEASE_TAG" artifacts/*/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
