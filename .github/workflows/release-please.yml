name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GITHUB_TOKEN-created PRs otherwise wait for approval on every update.
      # Only this repository's release bot and exact release branch are trusted.
      - name: Approve trusted release pull request workflows
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = 'release-please--branches--main--components--brains';
            const botId = 41898282; // github-actions[bot]
            const paths = new Set([
              '.github/workflows/ci.yml',
              '.github/workflows/pages.yml',
              '.github/workflows/auto-merge.yml',
            ]);
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', head: `${owner}:${branch}`,
            });
            const pull = pulls.find(pr =>
              pr.user.id === botId && pr.user.type === 'Bot' &&
              pr.head.repo?.id === context.payload.repository.id &&
              pr.head.ref === branch && pr.base.ref === 'main');
            if (!pull) {
              core.info('No open release-bot pull request needs workflow approval.');
              return;
            }
            const sha = pull.head.sha;
            const approved = new Set();
            for (let attempt = 0; attempt < 10; attempt++) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, event: 'pull_request', head_sha: sha, per_page: 100,
              });
              const observed = new Set();
              for (const run of runs) {
                if (!paths.has(run.path) || run.head_branch !== branch ||
                    run.actor?.id !== botId ||
                    !run.pull_requests.some(pr => pr.number === pull.number)) continue;
                observed.add(run.path);
                if (run.conclusion !== 'action_required' || approved.has(run.id)) continue;
                const { data: current } = await github.rest.pulls.get({
                  owner, repo, pull_number: pull.number,
                });
                if (current.state !== 'open' || current.head.sha !== sha) {
                  core.info('Release pull request changed; its next update will approve the new head.');
                  return;
                }
                await github.rest.actions.approveWorkflowRun({
                  owner, repo, run_id: run.id,
                });
                approved.add(run.id);
                core.info(`Approved ${run.path} run ${run.id} for #${pull.number} at ${sha}.`);
              }
              if (observed.size === paths.size) return;
              if (attempt < 9) await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error(`Expected release PR workflows have not appeared for #${pull.number} at ${sha}; rerun Release Please to retry.`);
      # Tags created with GITHUB_TOKEN do not trigger tag-push workflows.
      # Use the default branch's build recipe with the immutable release source.
      - name: Build release assets
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml -f version="$RELEASE_TAG"
