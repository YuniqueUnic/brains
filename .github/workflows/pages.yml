name: Pages demo

# Frontend-only demo for GitHub Pages: the web app runs against an in-memory
# backend supporting conditional writes, tombstones and restore. Search is
# simplified and all files reset on refresh; no server or credentials needed.
# One-time repo setup: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web app (demo backend)
        run: pnpm --dir apps/web build
        env:
          VITE_DEMO_MODE: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Install demo test browser
        run: pnpm --dir tests/e2e exec playwright install --with-deps chromium
      - name: Exercise the built demo
        run: pnpm --dir tests/e2e test:demo
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
