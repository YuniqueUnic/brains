name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # getrandom needs its wasm backend selected at compile time (rand 0.9 chain,
  # used by the Worker target only).
  WASM_RUSTFLAGS: --cfg getrandom_backend="wasm_js"

jobs:
  rust:
    name: Rust (fmt · clippy · test · wasm check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (workspace, all targets/features, warnings denied)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests (workspace, all features)
        run: cargo test --workspace --all-features
      - name: Worker wasm check
        run: cargo check -p brains-worker --target wasm32-unknown-unknown
        env:
          RUSTFLAGS: ${{ env.WASM_RUSTFLAGS }}

  api-codegen:
    name: SDK codegen drift (api/brains.idl ↔ sdk/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xidlc
        run: cargo install xidlc --locked --version 0.95.0 --features cli,fmt
      - name: Regenerate committed SDK artifacts
        run: bash scripts/gen-api.sh
      - name: Fail on any drift
        run: |
          git diff --exit-code -- sdk
          untracked=$(git ls-files --others --exclude-standard -- sdk)
          if [ -n "$untracked" ]; then
            echo "generated files missing from git: $untracked"
            exit 1
          fi

  web:
    name: Web build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --dir apps/web build
      - name: Typecheck e2e suite
        run: pnpm --dir tests/e2e exec tsc --noEmit

  e2e:
    name: Browser E2E (screenplay, real server)
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build server + web
        run: |
          cargo build -p brains-server
          pnpm --dir apps/web build
      - name: Install Playwright browser
        run: pnpm --dir tests/e2e exec playwright install --with-deps chromium
      - name: Run screenplay E2E
        working-directory: tests/e2e
        env:
          BRAINS_SERVER_BIN: ${{ github.workspace }}/target/debug/brains-server
          BRAINS_WEB_DIST: ${{ github.workspace }}/apps/web/dist
        run: pnpm exec playwright test
      - name: Upload failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: tests/e2e/test-results
          retention-days: 7

  worker-smoke:
    name: Cloudflare local smoke (workerd + R2/D1)
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install worker-build
        run: cargo install worker-build --locked
      - run: pnpm install --frozen-lockfile
      - name: Build web + worker wasm
        run: |
          pnpm --dir apps/web build
          cd apps/worker
          worker-build --release
        env:
          RUSTFLAGS: ${{ env.WASM_RUSTFLAGS }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated Worker business smoke
        run: python3 scripts/run-workerd.py -- bash tests/worker-smoke.sh

  worker-e2e:
    name: Browser E2E against the Worker (workerd)
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install worker-build
        run: cargo install worker-build --locked
      - run: pnpm install --frozen-lockfile
      - name: Build web + worker wasm
        run: |
          pnpm --dir apps/web build
          cd apps/worker
          worker-build --release
        env:
          RUSTFLAGS: ${{ env.WASM_RUSTFLAGS }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright browser
        run: pnpm --dir tests/e2e exec playwright install --with-deps chromium
      - name: Run screenplay E2E against an isolated Worker
        run: tests/e2e/run-workerd.sh
      - name: Upload failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-worker-failures
          path: tests/e2e/test-results
          retention-days: 7
