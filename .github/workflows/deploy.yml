name: Deploy (Cloudflare Workers)

# One-click deploy of the cloudflare-rust profile. Prerequisites (once):
#   1. Cloudflare API token with Workers/R2/D1 edit permissions, plus the
#      account id, as repo secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID.
#   2. Provisioned resources:
#        pnpm --dir apps/worker exec wrangler r2 bucket create brains-data
#        pnpm --dir apps/worker exec wrangler d1 create brains-index
#      …then paste the returned database_id into apps/worker/wrangler.toml.
#   3. Bootstrap all three instance secrets together with the first deploy:
#        pnpm exec wrangler deploy --secrets-file /private/path/brains-secrets.json
#      See docs/runbook.md. `secret put` immediately creates and deploys a version.
#      Subsequent workflow deploys retain the existing required secrets.
on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply D1 migrations to the remote index first"
        default: true
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web and install Worker build tool
        run: |
          pnpm --dir apps/web build
          cargo install worker-build --locked --version 0.8.7
      - name: Apply remote D1 migrations
        if: inputs.apply_migrations
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply BRAINS_INDEX --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy worker (Wrangler builds wasm once)
        working-directory: apps/worker
        run: pnpm exec wrangler deploy
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Done
        run: echo "worker deployed; open the URL from the wrangler output above"
