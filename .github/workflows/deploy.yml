name: Deploy (Cloudflare Workers)

# One-click deploy of the cloudflare-rust profile. Prerequisites (once):
#   1. Cloudflare API token with Workers/R2/D1 edit permissions, plus the
#      account id, as repo secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID.
#   2. Provisioned resources:
#        pnpm --dir apps/worker exec wrangler r2 bucket create brains-data
#        pnpm --dir apps/worker exec wrangler d1 create brains-index
#      …then paste the returned database_id into apps/worker/wrangler.toml.
#   3. Instance secrets (never in git):
#        cd apps/worker
#        pnpm exec wrangler secret put TOKEN_REGISTRY_JSON   # {"tokens":[{id,name,token_sha256,scopes,enabled}]}
#        pnpm exec wrangler secret put SESSION_SIGNING_KEY   # 64 hex chars
#        pnpm exec wrangler secret put CURSOR_SIGNING_KEY    # 64 hex chars
on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply D1 migrations to the remote index first"
        default: true
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web + worker
        run: |
          pnpm --dir apps/web build
          cd apps/worker
          cargo install worker-build --locked
          worker-build --release
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
      - name: Apply remote D1 migrations
        if: inputs.apply_migrations
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply BRAINS_INDEX --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy worker
        working-directory: apps/worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Done
        run: echo "worker deployed; open the URL from the wrangler output above"
