name: Deploy (Cloudflare Workers)

# Local and Actions deployments share scripts/cloudflare.py; see docs/cloudflare.md.
# Provision dedicated R2/D1 once and configure the selected GitHub Environment.
# Bootstrap all three instance secrets together; later deployments retain them.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment containing the target vars and secrets"
        default: production
        type: environment
      deploy_mcp:
        description: "Also deploy the configured read-only MCP Worker"
        default: false
        type: boolean
      apply_migrations:
        description: "Apply D1 migrations to the remote index first"
        default: true
        type: boolean

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRAINS_WORKER_NAME: ${{ vars.BRAINS_WORKER_NAME || 'brains' }}
      BRAINS_R2_BUCKET: ${{ vars.BRAINS_R2_BUCKET || 'brains-data' }}
      BRAINS_D1_DATABASE: ${{ vars.BRAINS_D1_DATABASE || 'brains-index' }}
      BRAINS_D1_DATABASE_ID: ${{ vars.BRAINS_D1_DATABASE_ID }}
      BRAINS_BASE_URL: ${{ vars.BRAINS_BASE_URL }}
      BRAINS_CUSTOM_DOMAIN: ${{ vars.BRAINS_CUSTOM_DOMAIN }}
      BRAINS_CUSTOM_DOMAIN_ZONE_ID: ${{ vars.BRAINS_CUSTOM_DOMAIN_ZONE_ID }}
      VAULT_ID: ${{ vars.VAULT_ID || 'default' }}
      MAX_TEXT_BYTES: ${{ vars.MAX_TEXT_BYTES || '262144' }}
      MAX_ATTACHMENT_BYTES: ${{ vars.MAX_ATTACHMENT_BYTES || '8388608' }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      SEMANTIC_SEARCH: ${{ vars.SEMANTIC_SEARCH || 'off' }}
      BRAINS_MCP_API_TOKEN: ${{ secrets.BRAINS_MCP_API_TOKEN }}
      BRAINS_MCP_ACCESS_TOKEN: ${{ secrets.BRAINS_MCP_ACCESS_TOKEN }}
      BRAINS_MCP_WORKER_NAME: ${{ vars.BRAINS_MCP_WORKER_NAME }}
      BRAINS_MCP_HOSTNAME: ${{ vars.BRAINS_MCP_HOSTNAME }}
      BRAINS_CLOUD_CONFIG: ${{ vars.BRAINS_CLOUD_CONFIG }}
      BRAINS_RESOURCE_PROFILE: ${{ vars.BRAINS_RESOURCE_PROFILE }}
      BRAINS_RESOURCE_ACCOUNT: ${{ vars.BRAINS_RESOURCE_ACCOUNT }}
      BRAINS_RESOURCE_OBSERVATIONS: ${{ vars.BRAINS_RESOURCE_OBSERVATIONS }}
      BRAINS_OBSERVATION_TTL_SECONDS: ${{ vars.BRAINS_OBSERVATION_TTL_SECONDS || '86400' }}
      BRAINS_AI_SEARCH_NAMESPACE: ${{ vars.BRAINS_AI_SEARCH_NAMESPACE || 'default' }}
      BRAINS_RECONCILE_CRON: ${{ vars.BRAINS_RECONCILE_CRON || '*/5 * * * *' }}
      BRAINS_R2_LIST_PAGE_MAX: ${{ vars.BRAINS_R2_LIST_PAGE_MAX || '4' }}
      BRAINS_WORKER_CPU_MS: ${{ vars.BRAINS_WORKER_CPU_MS }}
      BRAINS_WORKER_SUBREQUESTS: ${{ vars.BRAINS_WORKER_SUBREQUESTS }}
      BRAINS_WORKER_LOG_SAMPLE_RATE: ${{ vars.BRAINS_WORKER_LOG_SAMPLE_RATE || '0.1' }}
      BRAINS_APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
      BRAINS_ADMIN_TOKEN: ${{ secrets.BRAINS_ADMIN_TOKEN }}
      TOKEN_REGISTRY_JSON: ${{ secrets.TOKEN_REGISTRY_JSON }}
      SESSION_SIGNING_KEY: ${{ secrets.SESSION_SIGNING_KEY }}
      CURSOR_SIGNING_KEY: ${{ secrets.CURSOR_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Install the repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the Worker build tool
        run: cargo install worker-build --locked --version 0.8.7
      - name: Check, migrate, deploy and verify the Worker
        run: pnpm cloudflare:deploy
      - name: Deploy the optional read-only MCP Worker
        if: ${{ inputs.deploy_mcp }}
        run: pnpm cloudflare:mcp-deploy
