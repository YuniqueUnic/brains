[package]
name = "brains-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
brains-adapter-fs.workspace = true
brains-adapter-sqlite.workspace = true
brains-api-http = { workspace = true, features = ["local"] }
brains-application.workspace = true
brains-local.workspace = true
brains-ports.workspace = true
brains-domain.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
