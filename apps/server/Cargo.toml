[package]
name = "brains-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Same release tarballs as brains-cli (see the binstall metadata there);
# binstall picks brains-server out of the shared archive.
[package.metadata.binstall]
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/brains-{ version }-macos-arm64.{ archive-format }"
bin-dir = "brains-{ version }-macos-arm64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/brains-{ version }-macos-x64.{ archive-format }"
bin-dir = "brains-{ version }-macos-x64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/brains-{ version }-linux-x64.{ archive-format }"
bin-dir = "brains-{ version }-linux-x64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/brains-{ version }-linux-arm64.{ archive-format }"
bin-dir = "brains-{ version }-linux-arm64/{ bin }{ binary-ext }"

[features]
default = ["fts", "convert"]
fts = ["brains-local/fts"]
# Embedded document conversion (issue #19), reported by capabilities; the
# conversion itself is invoked client-side over existing APIs.
convert = ["brains-adapter-convert/xberg"]

[dependencies]
brains-adapter-convert = { workspace = true, optional = true }
brains-build-info.workspace = true
axum.workspace = true
brains-adapter-fs.workspace = true
brains-adapter-turso.workspace = true
brains-api-http = { workspace = true, features = ["local"] }
brains-application.workspace = true
brains-local.workspace = true
brains-ports.workspace = true
brains-domain.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "macros"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
hex.workspace = true
sha2.workspace = true
brains-sdk = { path = "../../sdk/rust" }
reqwest = { workspace = true, features = ["json"] }
serde_json.workspace = true
tempfile = "3.27.0"
xidl-rust-axum = { workspace = true, features = ["client"] }
