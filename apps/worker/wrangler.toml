# Cloudflare deploy config (design §23.3). Local simulation: `wrangler dev`
# runs workerd with local R2/D1 — no cloud credentials required.
name = "brains"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-07"

[build]
command = "worker-build --release"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/healthz"]

[[r2_buckets]]
binding = "BRAINS_BUCKET"
bucket_name = "brains-data"

[[d1_databases]]
binding = "BRAINS_INDEX"
database_name = "brains-index"
database_id = "local"
migrations_dir = "../../migrations/d1"

# Semantic search (issue #17): Workers AI embeddings + a Vectorize index,
# declared so a standard deployment has semantic search enabled. Disable
# explicitly with SEMANTIC_SEARCH=off; a missing binding downgrades
# capabilities to semantic_search=false with the reason (never a silent off).
[ai]
binding = "AI"

[[vectorize]]
binding = "BRAINS_VECTORS"
index_name = "brains-vectors"

[secrets]
required = ["TOKEN_REGISTRY_JSON", "SESSION_SIGNING_KEY", "CURSOR_SIGNING_KEY"]

[vars]
VAULT_ID = "default"
MAX_TEXT_BYTES = "262144"
MAX_ATTACHMENT_BYTES = "8388608"
# Embedding model identity; dimensions must match the Vectorize index.
EMBEDDING_MODEL = "@cf/baai/bge-small-en-v1.5"
EMBEDDING_DIMENSIONS = "384"
SEMANTIC_SEARCH = "on"
# First deployment: pass all three required secrets with `wrangler deploy --secrets-file`.
# Local verification generates isolated .dev.vars via scripts/run-workerd.py.
