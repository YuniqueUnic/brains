# Cloudflare deploy config (design §23.3). Local simulation: `wrangler dev`
# runs workerd with local R2/D1 — no cloud credentials required.
name = "brains"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-07"

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[build]
command = "worker-build --release"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/healthz"]

[[r2_buckets]]
binding = "BRAINS_BUCKET"
bucket_name = "brains-data"

[[d1_databases]]
binding = "BRAINS_INDEX"
database_name = "brains-index"
database_id = "local"
migrations_dir = "../../migrations/d1"

# Semantic search stays declared unavailable in /capabilities until the
# embedding retriever ships (roadmap issue); the AI/Vectorize bindings are
# added together with it. SEMANTIC_SEARCH=off records an explicit operator
# decision in capabilities.semantic.unavailable_reason.
[secrets]
required = ["TOKEN_REGISTRY_JSON", "SESSION_SIGNING_KEY", "CURSOR_SIGNING_KEY"]

[vars]
VAULT_ID = "default"
MAX_TEXT_BYTES = "262144"
MAX_ATTACHMENT_BYTES = "8388608"
SEMANTIC_SEARCH = "on"
# First deployment: pass all three required secrets with `wrangler deploy --secrets-file`.
# Local verification generates isolated .dev.vars via scripts/run-workerd.py.
