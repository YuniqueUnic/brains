# Cloudflare deploy config (design §23.3). Local simulation: `wrangler dev`
# runs workerd with local R2/D1 — no cloud credentials required.
name = "brains"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-07"

[build]
command = "worker-build --release"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/healthz"]

[[r2_buckets]]
binding = "BRAINS_BUCKET"
bucket_name = "brains-data"

[[d1_databases]]
binding = "BRAINS_INDEX"
database_name = "brains-index"
database_id = "local"
migrations_dir = "../../migrations/d1"

[vars]
VAULT_ID = "default"
MAX_TEXT_BYTES = "262144"
MAX_ATTACHMENT_BYTES = "8388608"
# Production: `wrangler secret put` TOKEN_REGISTRY_JSON, SESSION_SIGNING_KEY,
# CURSOR_SIGNING_KEY. Local dev reads the same names from .dev.vars.
