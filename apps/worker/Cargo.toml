[package]
name = "brains-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query", "macros"] }
base64.workspace = true
brains-adapter-d1.workspace = true
brains-adapter-r2.workspace = true
brains-api-http.workspace = true
brains-api-types.workspace = true
brains-application.workspace = true
brains-domain.workspace = true
hex.workspace = true
hmac.workspace = true
serde.workspace = true
serde_json.workspace = true
tower.workspace = true
sha2.workspace = true
worker = { version = "=0.8.7", features = ["axum", "http", "d1"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
