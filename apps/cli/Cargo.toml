[package]
name = "brains-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# The CLI is invoked as `bsx`.
[[bin]]
name = "bsx"
path = "src/main.rs"

[features]
default = ["fts", "convert", "url-import"]
fts = ["brains-client/fts"]
# Embedded document conversion (issue #19). The Worker and
# --no-default-features builds stay without it and report conversion as
# explicitly unavailable.
convert = ["brains-adapter-convert/xberg", "brains-client/convert"]
url-import = ["brains-client/url-import"]

[dependencies]
brains-adapter-convert = { workspace = true, optional = true }
brains-build-info.workspace = true
anyhow.workspace = true
brains-api-types.workspace = true
brains-application.workspace = true
brains-client.workspace = true
brains-domain.workspace = true
brains-ports.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_complete_nushell.workspace = true
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
assert_cmd = "2.2.2"
brains-server = { path = "../server" }
predicates = "3.1.4"
tempfile = "3.27.0"
