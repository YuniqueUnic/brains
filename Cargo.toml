[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/format",
    "crates/ports",
    "crates/application",
    "crates/adapter-fs",
    "crates/adapter-sqlite",
    "crates/api-types",
    "crates/api-http",
    "crates/adapter-r2",
    "crates/adapter-d1",
    "crates/client",
    "apps/server",
    "apps/worker",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://example.com/brains"

[workspace.dependencies]
brainstore-domain = { path = "crates/domain" }
brainstore-format = { path = "crates/format" }
brainstore-ports = { path = "crates/ports" }
brainstore-application = { path = "crates/application" }
brainstore-adapter-fs = { path = "crates/adapter-fs" }
brainstore-adapter-sqlite = { path = "crates/adapter-sqlite" }
brainstore-api-types = { path = "crates/api-types" }
brainstore-api-http = { path = "crates/api-http", default-features = false }
brainstore-adapter-r2 = { path = "crates/adapter-r2" }
brainstore-adapter-d1 = { path = "crates/adapter-d1" }
brainstore-client = { path = "crates/client" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "set-header", "trace"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "wasm-bindgen"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
pulldown-cmark = { version = "0.13", default-features = false }
fs2 = "0.4"
similar = { version = "3", features = ["text"] }
futures = "0.3"
bytes = "1"

[profile.release]
lto = "thin"
