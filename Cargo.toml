[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/format",
    "crates/ports",
    "crates/application",
    "crates/adapter-fs",
    "crates/adapter-turso",
    "crates/api-types",
    "crates/api-http",
    "crates/adapter-r2",
    "crates/adapter-d1",
    "crates/client",
    "crates/local",
    "apps/server",
    "apps/worker",
    "apps/cli",
    "sdk/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://example.com/brains"

[workspace.dependencies]
xidl-rust-axum = { version = "=0.99.0", default-features = false }
brains-domain = { path = "crates/domain" }
brains-format = { path = "crates/format" }
brains-ports = { path = "crates/ports" }
brains-application = { path = "crates/application" }
brains-adapter-fs = { path = "crates/adapter-fs" }
brains-adapter-turso = { path = "crates/adapter-turso", default-features = false }
brains-api-types = { path = "crates/api-types" }
brains-api-http = { path = "crates/api-http", default-features = false }
brains-adapter-r2 = { path = "crates/adapter-r2" }
brains-adapter-d1 = { path = "crates/adapter-d1" }
brains-client = { path = "crates/client", default-features = false }
brains-local = { path = "crates/local", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "set-header", "trace"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4.6"
clap_complete_nushell = "4.6"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
turso = { version = "=0.8.2", default-features = false }
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
time = { version = "0.3", features = ["formatting", "parsing", "wasm-bindgen"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
unicase = "2"
pulldown-cmark = { version = "0.13", default-features = false }
fs2 = "0.4"
similar = { version = "3", features = ["text"] }
diffy = "0.5.2"
futures = "0.3"
bytes = "1"

[profile.release]
lto = "thin"
